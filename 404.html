<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SightHall — Upgrade in progress</title>
<meta name="description" content="SightHall is being upgraded. A new version of the site is on its way.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#0d1117; --line:#243044; --text:#dbe4ee; --dim:#8b98a9;
    --accent:#3d8bfd; --accent2:#63b3ff;
  }
  *{margin:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:16px/1.6 "Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column}
  header{padding:18px 0;border-bottom:1px solid var(--line)}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px;width:100%}
  .logo{font-size:20px;font-weight:700;letter-spacing:.3px}
  .logo span{color:var(--accent2)}
  main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
  .msg h1{font-size:clamp(38px,7vw,72px);font-weight:700;line-height:1.15;letter-spacing:-.5px}
  .msg h1 em{font-style:normal;color:var(--accent2)}
  .msg p{margin:22px auto 0;max-width:560px;color:var(--dim);font-size:19px}
  .bar{margin:38px auto 0;width:min(340px,80%);height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,var(--accent),var(--accent2));
         border-radius:2px;animation:slide 2.4s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}55%{transform:translateX(320%)}100%{transform:translateX(320%)}}
  @media (prefers-reduced-motion: reduce){.bar i{animation:none;width:60%}}
  footer{padding:22px 0;text-align:center;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}
  footer a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent}
  footer a:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
  footer .sep{margin:0 8px;opacity:.5}
</style>
</head>
<body>

<header>
  <div class="wrap"><div class="logo">Sight<span>Hall</span></div></div>
</header>

<main>
  <div class="msg">
    <h1>A new SightHall<br>is <em>on its way</em>.</h1>
    <p>We're upgrading this site to match the next version of the product.
       Thank you for your patience — it will be worth the wait.</p>
    <div class="bar"><i></i></div>
  </div>
</main>

<footer>
  <div class="wrap">© 2026 SightHall<span class="sep">·</span><a href="mailto:support@sighthall.com">support@sighthall.com</a></div>
</footer>

</body>
</html>
